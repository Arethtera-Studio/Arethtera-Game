<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <style>
        /* Centers the clock perfectly on the page */
        body {
            background-color: #111;
            color: #0f0; /* Neon green color */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Styles the container box */
        .clock-container {
            background-color: #222;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            font-size: 4rem;
            font-weight: bold;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <!-- The HTML structure for the clock -->
    <div class="clock-container" id="clock">00:00:00</div>

    <!-- The JavaScript to fetch and update the time -->
    <script>
        function updateClock() {
            const now = new Date(); // Gets the current date and time
            
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            // Adds a leading zero to numbers less than 10 (e.g., "5" becomes "05")
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            // Combines the elements into a string
            const timeString = `${hours}:${minutes}:${seconds}`;

            // Injects the time string into the HTML container
            document.getElementById('clock').textContent = timeString;
        }

        // Updates the clock immediately on page load
        updateClock();

        // Runs the updateClock function every 1000 milliseconds (1 second)
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
